services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_DEPLOYMENT: "1"
      COOKIE_SECURE: "1"
      MAX_BETA_USERS: "100"
      BETA_INVITE_CODE: ${BETA_INVITE_CODE:?Set BETA_INVITE_CODE in .env}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Set APP_MASTER_KEY in .env}
      # Free mode (optional): members generate with the owner's OpenRouter key, kept server-side.
      PLATFORM_OPENROUTER_API_KEY: ${PLATFORM_OPENROUTER_API_KEY:-}
      PLATFORM_MODELS: ${PLATFORM_MODELS:-google/veo-3.1-lite}
      # provider:model pairs members may start, comma separated, or 'all'
      ENABLED_VIDEO_MODELS: ${ENABLED_VIDEO_MODELS:-openrouter:google/veo-3.1-lite}
      PLATFORM_CLIPS_PER_USER: ${PLATFORM_CLIPS_PER_USER:-3}
      PLATFORM_QUOTA_PERIOD: ${PLATFORM_QUOTA_PERIOD:-month}
      PLATFORM_DAILY_BUDGET_USD: ${PLATFORM_DAILY_BUDGET_USD:-5}
    expose:
      - "8010"
    volumes:
      - beta_data:/app/data
    networks:
      - internal
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
networks:
  internal:
volumes:
  beta_data:
  caddy_data:
  caddy_config:
